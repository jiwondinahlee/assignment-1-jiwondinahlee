<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Manager</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header>
            <img src="assets/menu_icon.png" alt="Menu" class="menu-icon">
            <form role="search">
                <img src="assets/search_icon.png" alt="Search">
                <input type="text" placeholder="Quick Find">
            </form>
            <span class="task-counter">
                <img src="assets/check_icon.png" alt="">
        30/5
            </span>
        </header>
        <nav>
            <ul>
                <li>
                    <img src="assets/inbox_icon.png" alt="">
                    Inbox <span class="count">5</span>
                </li>
                <li>
                    <img src="assets/calendar_icon.png" alt="">
                    Today <span class="count">5</span>
                </li>
                <li>
                    <img src="assets/upcoming_icon.png" alt="">
                    Upcoming
                </li>
            </ul>
        </nav>
        <main>
             <h1>Inbox</h1>
             <ul>
                <li>
                    <input type="checkbox">
                    Call Mom
                </li>
                <li>
                    <input type="checkbox">
                    Buy the new issue of Scientific American
                </li>
                <li>
                    <input type="checkbox">
                    Return the textbook to Josie
                </li>
                <li>
                    <input type="checkbox">
                    Buy the new album by Rake
                </li>
                <li>
                    <input type="checkbox">
                    Buy a gift card for Dad
                </li>
             </ul>
        </main>
    </body>
</html>
